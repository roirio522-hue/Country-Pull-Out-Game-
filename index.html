<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flag Royale - Rafid Ahamed PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Bebas+Neue&display=swap');
        
        body { 
            margin: 0; background: linear-gradient(to bottom, #b2ebf2, #e0f7fa); 
            overflow: hidden; 
            font-family: 'Oswald', sans-serif; 
            display: flex; flex-direction: column; 
            align-items: center; height: 100vh; 
            width: 100vw;
        }

        /* ফুল স্ক্রিন মোডে ব্যাকগ্রাউন্ড ঠিক রাখা */
        body:-webkit-full-screen { background: linear-gradient(to bottom, #b2ebf2, #e0f7fa); width: 100%; height: 100%; }

        #top-bar {
            margin-top: 10px; width: 95%; max-width: 600px;
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(255, 255, 255, 0.8); padding: 10px 0;
            border-bottom: 3px solid #00acc1; border-radius: 12px;
            z-index: 10; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-item { text-align: center; flex: 1; }
        .stat-label { font-size: 11px; color: #00838f; text-transform: uppercase; font-weight: 700; }
        .stat-value { font-size: 26px; color: #333; font-weight: 700; line-height: 1; }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 8px 18px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #start-btn { background: #ff5252; color: #fff; }
        #exit-btn { background: #455a64; color: #fff; }
        /* ফুল স্ক্রিন বাটন স্টাইল */
        #fs-btn { background: #00acc1; color: #fff; } 

        #comment-hook {
            margin-top: 5px; color: #d32f2f; 
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px; 
            text-align: center; text-transform: uppercase;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow { from { transform: scale(0.98); } to { transform: scale(1.02); } }

        #game-container {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            width: 100%; position: relative;
        }
        canvas { display: block; border-radius: 50%; border: 4px solid #2e7d32; }

        #leaderboard-box {
            width: 92%; max-width: 550px; height: 110px;
            background: rgba(255, 255, 255, 0.9); border: 1px solid #b2ebf2;
            border-radius: 12px; margin-bottom: 5px; padding: 10px;
            color: #333; overflow: hidden;
        }
        #leaderboard-box h3 { margin: 0 0 5px 0; font-size: 14px; color: #00838f; border-bottom: 1px solid #e0f7fa; }
        
        #history-list { display: flex; flex-direction: column; flex-wrap: wrap; height: 75px; gap: 5px; }
        .history-entry { width: 120px; background: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; border-left: 3px solid #00acc1; }

        #footer { width: 100%; padding: 5px 0; background: #e0f7fa; color: #546e7a; text-align: center; font-size: 10px; }

        #winner-popup { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(255,255,255,0.95); border: 4px solid #2e7d32; border-radius: 20px; 
            padding: 30px; color: #333; text-align: center; display: none; z-index: 1000; 
        }
        #winner-flag-img { width: 150px; border: 2px solid #00acc1; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="stat-item"><div class="stat-label">Season</div><div id="round-val" class="stat-value">1</div></div>
        <div class="stat-item" style="border-left:1px solid #b2ebf2;border-right:1px solid #b2ebf2;"><div class="stat-label">Alive</div><div id="alive-val" class="stat-value">0</div></div>
        <div class="stat-item"><div class="stat-label">Eliminated</div><div id="eliminated-val" class="stat-value">0</div></div>
    </div>

    <div class="controls">
        <button id="start-btn" class="btn" onclick="startNewGame()">Start</button>
        <button id="fs-btn" class="btn" onclick="toggleFullScreen()">Full Screen</button>
        <button id="exit-btn" class="btn" onclick="exitGame()">Exit</button>
    </div>

    <div id="comment-hook"><h5>📢 COMMENT YOUR COUNTRY! 📢</h5></div>

    <div id="game-container">
        <div id="winner-popup">
            <h1 id="win-flag-name" style="margin:0; font-size: 30px; color: #2e7d32; font-family: 'Bebas Neue';">WINNER!</h1>
            <img id="winner-flag-img" src="" alt="">
            <p style="margin-top: 15px; color: #666; font-size: 12px;">PREPARING NEXT ROUND...</p>
        </div>
    </div>

    <div id="leaderboard-box">
        <h3>🏆 Winners Hall</h3>
        <div id="history-list"></div>
    </div>

    <div id="footer">Created by <span>Rafid Ahammed</span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        // --- ফুল স্ক্রিন ফাংশন ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;
        const engine = Engine.create();
        const world = engine.world;
        engine.gravity.y = 1.35;

        const dpr = window.devicePixelRatio || 1;
        const baseSize = Math.min(window.innerWidth, window.innerHeight) * 0.85; 
        const width = baseSize; const height = baseSize;

        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: { width: width * dpr, height: height * dpr, wireframes: false, background: 'transparent' }
        });

        render.canvas.style.width = width + 'px';
        render.canvas.style.height = height + 'px';
        const ctx = render.canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        Render.run(render);
        const runner = Runner.create({ isFixed: true, delta: 1000 / 60 });
        Runner.run(runner, engine);

        const centerX = width / 2; const centerY = height / 2;
        const radius = width / 2.2;
        let balls = []; let outerCircle = []; let xBarrier = [];
        let gameActive = false; let roundCount = 1;

        const countries = [
            {n:"BANGLADESH", c:"bd"}, {n:"INDIA", c:"in"}, {n:"USA", c:"us"}, {n:"BRAZIL", c:"br"}, {n:"ARGENTINA", c:"ar"},
            {n:"GERMANY", c:"de"}, {n:"FRANCE", c:"fr"}, {n:"UK", c:"gb"}, {n:"CHINA", c:"cn"}, {n:"JAPAN", c:"jp"},
            {n:"PAKISTAN", c:"pk"}, {n:"CANADA", c:"ca"}, {n:"AUSTRALIA", c:"au"}, {n:"ITALY", c:"it"}, {n:"SPAIN", c:"es"},
            {n:"PORTUGAL", c:"pt"}, {n:"TURKEY", c:"tr"}, {n:"MALAYSIA", c:"my"}, {n:"INDONESIA", c:"id"}, {n:"SRI LANKA", c:"lk"}
        ];

        function startNewGame() { if (!gameActive) initGame(); }

        function exitGame() {
            gameActive = false;
            Composite.clear(world);
            balls = []; outerCircle = []; xBarrier = [];
            document.getElementById('alive-val').innerText = "0";
            document.getElementById('eliminated-val').innerText = "0";
            document.getElementById('winner-popup').style.display = 'none';
        }

        function initGame() {
            Composite.clear(world);
            balls = []; outerCircle = []; xBarrier = [];
            gameActive = true;
            document.getElementById('winner-popup').style.display = 'none';
            document.getElementById('round-val').innerText = roundCount;

            const segments = 90; 
            for (let i = 0; i < segments; i++) {
                if (i < 9) continue; 
                const angle = (i / segments) * Math.PI * 2;
                const wall = Bodies.rectangle(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius, 35, 15, { isStatic: true, angle: angle, render: { fillStyle: '#2e7d32' } });
                outerCircle.push(wall);
            }
            Composite.add(world, outerCircle);

            const crossLen = radius * 1.95;
            xBarrier = [
                Bodies.rectangle(centerX, centerY, crossLen, 14, { isStatic: true, angle: Math.PI / 4, render: { fillStyle: '#ff5252' } }),
                Bodies.rectangle(centerX, centerY, crossLen, 14, { isStatic: true, angle: -Math.PI / 4, render: { fillStyle: '#ff5252' } })
            ];
            Composite.add(world, xBarrier);

            countries.forEach((country) => {
                const imgUrl = `https://flagcdn.com/w160/${country.c}.png`;
                const ball = Bodies.rectangle(centerX + (Math.random()-0.5)*100, centerY + (Math.random()-0.5)*100, 32, 22, {
                    restitution: 0.6, friction: 0.05,
                    render: { sprite: { texture: imgUrl, xScale: 0.2, yScale: 0.2 } }
                });
                ball.isAlive = true; ball.flagUrl = imgUrl; ball.flagName = country.n;
                balls.push(ball);
            });
            Composite.add(world, balls);
            updateUI();
        }

        setInterval(() => {
            if (!gameActive) return;
            xBarrier.forEach(b => { b.isSensor = true; b.render.opacity = 0.1; });
            setTimeout(() => { xBarrier.forEach(b => { b.isSensor = false; b.render.opacity = 1; }); }, 1700); 
        }, 4500);

        function updateUI() {
            if (!gameActive) return;
            const alive = balls.filter(b => b.isAlive).length;
            document.getElementById('alive-val').innerText = alive;
            document.getElementById('eliminated-val').innerText = countries.length - alive;
        }

        Events.on(engine, 'beforeUpdate', () => {
            if (!gameActive) return;
            const rot = 0.022; 
            outerCircle.forEach(w => Body.rotate(w, rot, { x: centerX, y: centerY }));
            xBarrier.forEach(b => Body.rotate(b, rot, { x: centerX, y: centerY }));

            balls.forEach(ball => {
                if (ball.isAlive) {
                    const dist = Math.sqrt(Math.pow(ball.position.x - centerX, 2) + Math.pow(ball.position.y - centerY, 2));
                    if (dist > radius + 70) {
                        ball.isAlive = false;
                        updateUI();
                        checkWinner();
                    }
                }
            });
        });

        function checkWinner() {
            const alive = balls.filter(b => b.isAlive);
            if (alive.length === 1 && gameActive) {
                gameActive = false;
                const winner = alive[0];
                document.getElementById('win-flag-name').innerText = winner.flagName;
                document.getElementById('winner-flag-img').src = winner.flagUrl;
                document.getElementById('winner-popup').style.display = 'block';

                const entry = document.createElement('div');
                entry.className = 'history-entry';
                entry.innerHTML = `<b>R${roundCount}:</b> ${winner.flagName}`;
                document.getElementById('history-list').appendChild(entry);

                setTimeout(() => { roundCount++; initGame(); }, 5000);
            }
        }
    </script>
</body>
</html>
